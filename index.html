<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدير المتجر</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--pr:#0f9d73;--bd:#e1e6eb;--bad:#d64545;--warn:#e08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--tx:#e8edf2;--mut:#8b98a6;--bd:#26323f}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--tx:#e8edf2;--mut:#8b98a6;--bd:#26323f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding:12px 12px 84px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat b{display:block;font-size:20px;margin-top:2px}.stat span,.mut{color:var(--mut);font-size:13px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--pr);color:#fff}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin-inline:auto}
.tabs button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}.tabs button.on{color:var(--pr);font-weight:700}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.low{color:var(--warn);border-color:var(--warn)}.out{color:var(--bad);border-color:var(--bad)}
.pos{color:var(--pr)}.neg{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<h1>🏪 مدير المتجر</h1>

<section id="t-sum">
  <div class="grid">
    <div class="card stat"><span>مبيعات اليوم</span><b id="s1">0</b></div>
    <div class="card stat"><span>ربح اليوم</span><b id="s2" class="pos">0</b></div>
    <div class="card stat"><span>ربح هذا الشهر</span><b id="s3" class="pos">0</b></div>
    <div class="card stat"><span>قيمة المخزون (بالتكلفة)</span><b id="s4">0</b></div>
  </div>
  <div class="card"><b>تنبيهات المخزون</b><div id="alerts" class="mut" style="margin-top:6px"></div></div>
  <div class="card"><b>آخر المبيعات</b><div id="sales" style="margin-top:6px"></div></div>
  <div class="card row sp"><span class="mut">نسخة احتياطية من بياناتك</span><span class="row"><button class="g" onclick="exp()">تصدير</button><button class="g" onclick="document.getElementById('imp').click()">استيراد</button></span><input id="imp" type="file" accept=".json" class="hide" onchange="imp(event)"></div>
</section>

<section id="t-prod" class="hide">
  <div class="card">
    <b id="ftitle">إضافة منتج</b>
    <label>اسم المنتج</label><input id="n">
    <div class="grid">
      <div><label>الكمية المشتراة</label><input id="q" type="number" inputmode="decimal" min="0"></div>
      <div><label>سعر الشراء الإجمالي (جملة)</label><input id="b" type="number" inputmode="decimal" min="0"></div>
      <div><label>سعر بيع الوحدة</label><input id="p" type="number" inputmode="decimal" min="0"></div>
      <div><label>تنبيه عند أقل من</label><input id="l" type="number" inputmode="numeric" min="0" value="3"></div>
    </div>
    <div id="prev" class="mut" style="margin:10px 0"></div>
    <div class="row"><button onclick="save()" style="flex:1">حفظ</button><button class="g" onclick="reset()">إلغاء</button></div>
  </div>
  <input id="srch" placeholder="🔍 ابحث عن منتج" oninput="draw()" style="margin-bottom:10px">
  <div id="list"></div>
</section>

<nav class="tabs">
  <button class="on" onclick="tab('sum',this)">الملخص</button>
  <button onclick="tab('prod',this)">المنتجات والبيع</button>
</nav>

<script>
var P=[],S=[],E=null;
function ld(){try{P=JSON.parse(localStorage.getItem('sm_p')||'[]');S=JSON.parse(localStorage.getItem('sm_s')||'[]')}catch(e){P=[];S=[]}}
function sv(){try{localStorage.setItem('sm_p',JSON.stringify(P));localStorage.setItem('sm_s',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function f(x){return (Math.round(x*100)/100).toLocaleString('en-US')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tab(t,btn){['sum','prod'].forEach(function(x){$('t-'+x).classList.toggle('hide',x!==t)});document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b===btn)});draw()}
function prev(){var q=+$('q').value,b=+$('b').value,p=+$('p').value;if(q>0&&b>=0){var u=b/q;$('prev').innerHTML='تكلفة الوحدة: <b>'+f(u)+'</b>'+(p>0?' · الربح للوحدة: <b class="'+(p>=u?'pos':'neg')+'">'+f(p-u)+'</b> · ربح الكمية كاملة: <b>'+f((p-u)*q)+'</b>':'')}else $('prev').textContent=''}
['q','b','p'].forEach(function(i){$(i).addEventListener('input',prev)});
function reset(){E=null;['n','q','b','p'].forEach(function(i){$(i).value=''});$('l').value=3;$('ftitle').textContent='إضافة منتج';prev()}
function save(){var n=$('n').value.trim(),q=+$('q').value,b=+$('b').value,p=+$('p').value,l=+$('l').value||0;
 if(!n||!(q>=0)||!(b>=0)||!(p>=0)||$('q').value===''||$('b').value===''||$('p').value===''){alert('أكمل الاسم والكمية والأسعار');return}
 var u=q>0?b/q:0;
 if(E){var x=P.find(function(a){return a.id===E});x.n=n;x.q=q;x.u=u;x.p=p;x.l=l}
 else P.push({id:Date.now(),n:n,q:q,u:u,p:p,l:l});
 sv();reset();draw()}
function edit(id){var x=P.find(function(a){return a.id===id});E=id;$('n').value=x.n;$('q').value=x.q;$('b').value=x.u*x.q;$('p').value=x.p;$('l').value=x.l;$('ftitle').textContent='تعديل منتج (الكمية = المتبقي حاليًا)';prev();scrollTo(0,0)}
function del(id){if(confirm('حذف المنتج؟')){P=P.filter(function(a){return a.id!==id});sv();draw()}}
function sell(id){var x=P.find(function(a){return a.id===id}),n=+$('s'+id).value||1;
 if(n>x.q){alert('الكمية المتاحة '+x.q+' فقط');return}
 x.q-=n;S.unshift({id:Date.now(),pid:id,n:x.n,q:n,r:x.p*n,g:(x.p-x.u)*n,t:Date.now()});sv();draw()}
function draw(){
 var s=($('srch').value||'').trim().toLowerCase();
 $('list').innerHTML=P.filter(function(a){return a.n.toLowerCase().indexOf(s)>-1}).map(function(a){
  var st=a.q<=0?'<span class="tag out">نفد</span>':a.q<=a.l?'<span class="tag low">منخفض</span>':'';
  return '<div class="card"><div class="row sp"><b>'+esc(a.n)+'</b>'+st+'</div>'+
  '<div class="mut" style="margin:6px 0">المتبقي: <b style="color:var(--tx)">'+f(a.q)+'</b> · تكلفة: '+f(a.u)+' · بيع: '+f(a.p)+' · ربح/وحدة: <span class="'+(a.p>=a.u?'pos':'neg')+'">'+f(a.p-a.u)+'</span></div>'+
  '<div class="row"><input id="s'+a.id+'" type="number" inputmode="numeric" min="1" value="1" style="width:70px"><button onclick="sell('+a.id+')" '+(a.q<=0?'disabled style="opacity:.4"':'')+'>بيع</button><button class="g" onclick="edit('+a.id+')">تعديل</button><button class="d" onclick="del('+a.id+')">حذف</button></div></div>'}).join('')||'<div class="mut" style="text-align:center;padding:20px">لا توجد منتجات بعد. أضف أول منتج من الأعلى.</div>';
 var d=new Date(),d0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),m0=new Date(d.getFullYear(),d.getMonth(),1).getTime();
 var td=S.filter(function(x){return x.t>=d0}),mo=S.filter(function(x){return x.t>=m0});
 var sum=function(a,k){return a.reduce(function(t,x){return t+x[k]},0)};
 $('s1').textContent=f(sum(td,'r'));$('s2').textContent=f(sum(td,'g'));$('s3').textContent=f(sum(mo,'g'));
 $('s4').textContent=f(P.reduce(function(t,a){return t+a.q*a.u},0));
 var al=P.filter(function(a){return a.q<=a.l});
 $('alerts').innerHTML=al.length?al.map(function(a){return '• '+esc(a.n)+': '+(a.q<=0?'نفد':'متبقي '+f(a.q))}).join('<br>'):'كل شيء متوفر ✅';
 $('sales').innerHTML=S.slice(0,8).map(function(x){return '<div class="row sp" style="padding:5px 0;border-bottom:1px solid var(--bd)"><span>'+esc(x.n)+' × '+x.q+'</span><span class="mut">'+f(x.r)+' · <span class="pos">+'+f(x.g)+'</span></span></div>'}).join('')||'<span class="mut">لا مبيعات بعد</span>'}
function exp(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({P:P,S:S})],{type:'application/json'}));a.download='store-backup.json';a.click()}
function imp(e){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);P=o.P||[];S=o.S||[];sv();draw()}catch(x){alert('ملف غير صالح')}};if(e.target.files[0])r.readAsText(e.target.files[0])}
ld();draw();
</script>
</body>
</html>
